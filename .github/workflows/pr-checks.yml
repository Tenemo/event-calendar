name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  quality:
    name: Build and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          install_args: java maven node actionlint
          cache: true
      - name: Lint workflows
        run: mise run lint-workflows
      - name: Lint CSS
        run: mise run lint-css
      - name: Build and test
        run: mise run package
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: unit-test-diagnostics-${{ github.run_attempt }}
          path: .build/package/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  end-to-end:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          install_args: java maven
          cache: true
      - name: Run isolated Chromium tests
        run: mise run end-to-end
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: browser-test-diagnostics-${{ github.run_attempt }}
          path: |
            .build/package/failsafe-reports/**
            .build/package/end-to-end-application.log
            .build/package/end-to-end-liberty.log
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          install_args: node
          cache: true
      - name: Start isolated application
        run: docker compose --project-name shared-calendar-lighthouse --profile verification up --build --detach --wait --wait-timeout 180 postgres-verification web-verification
      - name: Check performance budgets
        env:
          APP_BASE_URL: https://localhost:19445
        run: mise run lighthouse
      - name: Stop isolated application
        if: always()
        run: docker compose --project-name shared-calendar-lighthouse --profile verification down --volumes --remove-orphans
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: lighthouse-reports-${{ github.run_attempt }}
          path: .build/lighthouse/**
          if-no-files-found: ignore
          retention-days: 14
