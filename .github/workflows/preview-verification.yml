name: Preview verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number whose Railway preview should be verified
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: >-
    preview-verification-${{
    github.event_name == 'workflow_dispatch' && inputs.pull_request_number ||
    github.event.deployment.environment || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify preview authentication
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'railway-app[bot]' &&
      github.event.deployment.creator.id == 68434857 &&
      github.event.deployment.task == 'deploy' &&
      startsWith(github.event.deployment.environment, 'calendar.social / event-calendar-pr-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out trusted verifier code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve pull request and expected revision
        id: deployment
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_REVISION: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "deployment_status" ]]; then
            if [[ ! "$DEPLOYMENT_ENVIRONMENT" =~ ^calendar\.social\ /\ event-calendar-pr-([1-9][0-9]*)$ ]]; then
              echo "::error::Railway deployment environment did not identify one pull request."
              exit 1
            fi
            pull_request_number="${BASH_REMATCH[1]}"
            expected_revision="$DEPLOYMENT_REVISION"
          else
            pull_request_number="$MANUAL_PULL_REQUEST_NUMBER"
            if [[ ! "$pull_request_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Pull request number must be a positive integer."
              exit 1
            fi
            expected_revision="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_request_number}" --jq .head.sha)"
          fi
          if [[ ! "$expected_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected revision must be a full lowercase Git commit SHA."
            exit 1
          fi
          echo "pull_request_number=$pull_request_number" >> "$GITHUB_OUTPUT"
          echo "expected_revision=$expected_revision" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted Railway preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.deployment.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if preview_url="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" --paginate --slurp |
                node scripts/resolve-railway-preview-url.mjs "$PULL_REQUEST_NUMBER" 2>/dev/null
            )"; then
              echo "base_url=$preview_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" --paginate --slurp |
            node scripts/resolve-railway-preview-url.mjs "$PULL_REQUEST_NUMBER"
          echo "::error::Railway did not publish a trusted preview URL within 15 minutes."
          exit 1

      - name: Require preview verification secrets
        env:
          PREVIEW_BOOTSTRAP_INVITE_TOKEN: ${{ secrets.PREVIEW_BOOTSTRAP_INVITE_TOKEN }}
          PREVIEW_VERIFICATION_PASSWORD: ${{ secrets.PREVIEW_VERIFICATION_PASSWORD }}
        run: |
          set -euo pipefail
          missing_secrets=()
          [[ -n "$PREVIEW_BOOTSTRAP_INVITE_TOKEN" ]] || missing_secrets+=(PREVIEW_BOOTSTRAP_INVITE_TOKEN)
          [[ -n "$PREVIEW_VERIFICATION_PASSWORD" ]] || missing_secrets+=(PREVIEW_VERIFICATION_PASSWORD)
          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing_secrets[*]}."
            exit 1
          fi

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          install_args: java
          cache: true

      - name: Restore Maven dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pom.xml') }}

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify exact deployed revision and read-only routes
        env:
          EXPECTED_REVISION: ${{ steps.deployment.outputs.expected_revision }}
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: >-
          java scripts/verify-production-deployment.java
          --base-url "$PREVIEW_BASE_URL"
          --expected-revision "$EXPECTED_REVISION"
          --timeout-seconds 900
          --poll-interval-seconds 5

      - name: Verify preview registration and authentication
        env:
          BROWSER: chromium
          PREVIEW_BOOTSTRAP_INVITE_TOKEN: ${{ secrets.PREVIEW_BOOTSTRAP_INVITE_TOKEN }}
          PREVIEW_VERIFICATION_BASE_URL: ${{ steps.preview.outputs.base_url }}
          PREVIEW_VERIFICATION_PASSWORD: ${{ secrets.PREVIEW_VERIFICATION_PASSWORD }}
          PREVIEW_VERIFICATION_PULL_REQUEST_NUMBER: ${{ steps.deployment.outputs.pull_request_number }}
        run: java scripts/calendar-tool.java verify-preview-deployment
