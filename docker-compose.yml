x-application-healthcheck: &application-healthcheck
  test: ["CMD-SHELL", "response=\"$$(curl --fail --silent http://localhost:9080/health)\" && [ \"$$response\" = \"ok\" ]"]
  interval: 3s
  start_interval: 500ms
  timeout: 5s
  retries: 40
  start_period: 20s

services:
  postgres:
    image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_DB: ${PGDATABASE:-calendar}
      POSTGRES_PASSWORD: ${PGPASSWORD:-calendar}
      POSTGRES_USER: ${PGUSER:-calendar}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - calendar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    profiles: [application]
    image: shared-calendar:local
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${PORT:-9080}}
      APP_BOOTSTRAP_INVITATION_TOKEN: ${APP_BOOTSTRAP_INVITATION_TOKEN:-}
      APP_DEFAULT_TIME_ZONE: ${APP_DEFAULT_TIME_ZONE:-Europe/Warsaw}
      APP_LOCAL_AUTO_SIGN_IN: ${APP_LOCAL_AUTO_SIGN_IN:-true}
      APP_LTPA_KEYS_PASSWORD: ${APP_LTPA_KEYS_PASSWORD:-local-development-only}
      APP_SSO_REQUIRES_SSL: ${APP_SSO_REQUIRES_SSL:-false}
      HTTPS_PORT: 9443
      PGAPPLICATIONNAME: shared-calendar-compose
      PGDATABASE: ${PGDATABASE:-calendar}
      PGHOST: postgres
      PGPASSWORD: ${PGPASSWORD:-calendar}
      PGPORT: 5432
      PGUSER: ${PGUSER:-calendar}
      PORT: 9080
    ports:
      - "127.0.0.1:${PORT:-9080}:9080"
      - "127.0.0.1:${HTTPS_PORT:-9443}:9443"
    healthcheck: *application-healthcheck

  postgres-verification:
    profiles: [verification]
    image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_DB: shared_calendar_verification
      POSTGRES_PASSWORD: shared_calendar_verification
      POSTGRES_USER: shared_calendar_verification
    ports:
      - "127.0.0.1:${VERIFICATION_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared_calendar_verification -d shared_calendar_verification"]
      interval: 2s
      timeout: 5s
      retries: 30

  web-verification:
    profiles: [verification]
    image: shared-calendar:verification
    build: .
    depends_on:
      postgres-verification:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${VERIFICATION_APP_BASE_URL:-https://localhost:${VERIFICATION_HTTPS_PORT:-19445}}
      APP_BOOTSTRAP_INVITATION_TOKEN: verification-only-bootstrap-token-0000000000
      APP_DEFAULT_TIME_ZONE: Europe/Warsaw
      APP_LOCAL_AUTO_SIGN_IN: "false"
      APP_LTPA_KEYS_PASSWORD: verification-only-ltpa-password
      APP_SSO_REQUIRES_SSL: ${VERIFICATION_SSO_REQUIRES_SSL:-true}
      HTTPS_PORT: 9443
      PGAPPLICATIONNAME: shared-calendar-verification
      PGDATABASE: shared_calendar_verification
      PGHOST: postgres-verification
      PGPASSWORD: shared_calendar_verification
      PGPORT: 5432
      PGUSER: shared_calendar_verification
      PORT: 9080
    ports:
      - "127.0.0.1:${VERIFICATION_HTTP_PORT:-19082}:9080"
      - "127.0.0.1:${VERIFICATION_HTTPS_PORT:-19445}:9443"
    healthcheck: *application-healthcheck

volumes:
  calendar_postgres:
