<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/main.xhtml">
    <f:metadata>
        <!-- Keep the previous continuation parameter readable while new links use token. -->
        <f:viewParam name="invite" value="#{loginView.invitationToken}"/>
        <f:viewParam name="token" value="#{loginView.invitationToken}"/>
        <f:viewParam name="passwordChanged" value="#{loginView.passwordChangedParameter}"/>
        <f:viewParam name="reauthenticationRequired" value="#{loginView.reauthenticationRequiredParameter}"/>
    </f:metadata>
    <ui:define name="title">Sign in - Shared calendar</ui:define>
    <ui:define name="messages">
        <h:messages id="messages"
                    showDetail="true"
                    styleClass="lightweight-messages"
                    pt:role="alert"/>
    </ui:define>

    <ui:define name="content">
        <section class="narrow-section">
            <h1 id="signInHeading">Sign in</h1>
            <h:panelGroup layout="block"
                          styleClass="notice-message"
                          rendered="#{loginView.passwordChanged}">
                Your password was changed. Sign in with the new password.
            </h:panelGroup>
            <h:panelGroup layout="block"
                          styleClass="notice-message"
                          rendered="#{loginView.reauthenticationRequired}">
                Your session is no longer valid. Sign in again.
            </h:panelGroup>
            <h:panelGroup layout="block"
                          styleClass="surface-panel form-panel lightweight-panel"
                          pt:aria-labelledby="signInHeading">
                <h:form styleClass="stacked-form">
                    <h:inputHidden value="#{loginView.invitationToken}"/>
                    <h:outputLabel for="username" value="Username"/>
                    <h:inputText id="username"
                                 value="#{loginView.username}"
                                 styleClass="native-input"
                                 pt:autocomplete="username"
                                 maxlength="80"
                                 required="true"
                                 requiredMessage="Username is required."/>

                    <h:outputLabel for="password" value="Password"/>
                    <h:inputSecret id="password"
                                   value="#{loginView.password}"
                                   styleClass="native-input"
                                   pt:autocomplete="current-password"
                                   maxlength="#{passwordService.maximumPasswordLength}"
                                   required="true"
                                   requiredMessage="Password is required."/>

                    <h:commandButton value="Sign in"
                                     action="#{loginView.login}"
                                     styleClass="native-button"/>
                </h:form>
                <p class="form-footer">
                    Registration requires an invitation link.
                </p>
            </h:panelGroup>
        </section>
    </ui:define>
</ui:composition>
