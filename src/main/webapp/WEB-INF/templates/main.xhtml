<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      lang="en">
<h:head>
    <title><ui:insert name="title">calendar.social</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description"
          content="Create and share practical event calendars with friends, clubs, and groups."/>
    <meta name="theme-color" content="#0b1020"/>
    <link rel="icon"
          type="image/svg+xml"
          sizes="any"
          href="#{resource['images:calendar-mark.svg']}&amp;revision=#{assetRevision.value}"/>
    <ui:insert name="head"/>
    <link rel="stylesheet" href="#{resource['css:application.css']}&amp;revision=#{assetRevision.value}"/>
</h:head>
<h:body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="app-header">
        <div class="app-brand-lockup">
            <h:outputLink value="#{request.contextPath}/" styleClass="app-brand">
                <h:graphicImage library="images" name="calendar-mark.svg" styleClass="app-brand-mark" alt=""/>
                <span>calendar.social</span>
            </h:outputLink>
        </div>
        <nav class="app-nav" aria-label="Main navigation">
            <h:outputLink value="#{request.contextPath}/">Home</h:outputLink>
            <h:outputLink value="#{request.contextPath}/app/calendars"
                          rendered="#{currentUser.signedIn}"
                          styleClass="#{request.servletPath.startsWith('/app/calendar') ? 'current-nav-item' : ''}"
                          pt:aria-current="#{request.servletPath.startsWith('/app/calendar') ? 'page' : null}">My calendars</h:outputLink>
            <h:outputLink value="#{request.contextPath}/app/invitations"
                          rendered="#{currentUser.signedIn}"
                          styleClass="#{request.servletPath.startsWith('/app/invitations') ? 'current-nav-item' : ''}"
                          pt:aria-current="#{request.servletPath.startsWith('/app/invitations') ? 'page' : null}">Invitations</h:outputLink>
            <h:outputLink value="#{request.contextPath}/app/account-settings"
                          rendered="#{currentUser.signedIn}"
                          styleClass="#{request.servletPath.startsWith('/app/account-settings') ? 'current-nav-item' : ''}"
                          pt:aria-current="#{request.servletPath.startsWith('/app/account-settings') ? 'page' : null}">Account settings</h:outputLink>
            <h:outputLink value="#{request.contextPath}/sign-in" rendered="#{not currentUser.signedIn}">Sign in</h:outputLink>
            <h:form styleClass="nav-form" rendered="#{currentUser.signedIn}">
                <h:commandButton value="Sign out"
                                 action="#{signOutView.signOut}"
                                 styleClass="app-button app-button-secondary"/>
            </h:form>
        </nav>
    </header>

    <main id="main-content" class="app-main" tabindex="-1">
        <ui:insert name="messages">
            <p:messages id="messages" showDetail="true" closable="true" pt:tabindex="-1"/>
        </ui:insert>
        <h:panelGroup layout="block"
                      styleClass="notice-message view-expired-message"
                      rendered="#{param.viewExpired eq 'true'}"
                      pt:role="status">
            This page expired while it was open. Please try again.
        </h:panelGroup>
        <ui:insert name="content"/>
    </main>
    <script src="#{resource['js:keyboard-navigation.js']}&amp;revision=#{assetRevision.value}"></script>
    <script src="#{resource['js:calendar-widgets.js']}&amp;revision=#{assetRevision.value}"></script>
    <script src="#{resource['js:clipboard.js']}&amp;revision=#{assetRevision.value}"></script>
</h:body>
</html>
