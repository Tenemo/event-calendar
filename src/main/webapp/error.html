<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <title>Something went wrong - Shared calendar</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f8fb;
            color: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            place-items: center;
        }

        main {
            width: min(100%, 32rem);
            padding: 2rem;
            border: 1px solid #dde3eb;
            border-radius: 0.5rem;
            background: #fff;
            box-shadow: 0 1px 3px rgb(17 24 39 / 8%);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.75rem, 8vw, 2.5rem);
            line-height: 1.1;
        }

        p {
            margin: 1rem 0 0;
            line-height: 1.6;
        }

        a {
            color: #1d4ed8;
            font-weight: 700;
        }

        a:focus-visible {
            outline: 3px solid #0f3d9e;
            outline-offset: 3px;
        }

        @media (forced-colors: active) {
            main {
                border-color: CanvasText;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Something went wrong</h1>
    <p>The request could not be completed. Please try again.</p>
    <p><a href="./">Return to the home page</a></p>
</main>
</body>
</html>
