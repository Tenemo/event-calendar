<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:app="jakarta.faces.composite/app-components"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/main.xhtml">
    <ui:define name="title">Invitations - calendar.social</ui:define>

    <ui:define name="content">
        <section class="page-section">
            <app:page-header id="invitationHeader"
                             title="Invitations"
                             description="Create single-use registration and editor links. Links expire after seven days."/>

            <div class="form-grid">
                <p:panel styleClass="surface-panel" pt:aria-labelledby="registrationInvitationHeading">
                    <h2 id="registrationInvitationHeading" class="panel-heading">Registration invitation</h2>
                    <h:form styleClass="stacked-form">
                        <p:commandButton value="Generate registration link"
                                         action="#{invitationView.createRegistrationInvitation}"
                                         ajax="false"/>
                    </h:form>
                </p:panel>

                <p:panel styleClass="surface-panel" pt:aria-labelledby="editorInvitationHeading">
                    <h2 id="editorInvitationHeading" class="panel-heading">Editor invitation</h2>
                    <h:form styleClass="stacked-form" rendered="#{invitationView.hasEditableCalendars()}">
                        <p:outputLabel for="calendar" value="Calendar"/>
                        <h:selectOneMenu id="calendar"
                                         value="#{invitationView.selectedCalendarId}"
                                         required="true"
                                         requiredMessage="Calendar is required.">
                            <f:selectItem itemLabel="Select calendar" noSelectionOption="true"/>
                            <f:selectItems value="#{invitationView.editableCalendars}"
                                           var="calendar"
                                           itemValue="#{calendar.id}"
                                           itemLabel="#{calendar.name}"/>
                        </h:selectOneMenu>

                        <p:commandButton value="Generate editor link"
                                         action="#{invitationView.createEditorInvitation}"
                                         ajax="false"/>
                    </h:form>
                    <h:panelGroup layout="block" rendered="#{not invitationView.hasEditableCalendars()}">
                        <p>No editable calendars are available.</p>
                    </h:panelGroup>
                </p:panel>
            </div>

            <h:panelGroup layout="block"
                          styleClass="generated-invitation"
                          rendered="#{invitationView.hasGeneratedInvitationLink()}">
                <app:copy-field id="generatedInvitationLink"
                                value="#{invitationView.generatedInvitationLink}"
                                label="Generated link"
                                help="You can also select the link and copy it manually."
                                buttonLabel="Copy generated link"/>
            </h:panelGroup>

            <app:empty-state id="emptyInvitationList"
                             title="No outstanding invitations"
                             description="New invitation links will appear here until they are accepted, revoked, or expire."
                             rendered="#{empty invitationView.invitations}"/>
            <div class="card-list">
                <ui:repeat value="#{invitationView.invitations}" var="invitation">
                    <article class="list-card invitation-card">
                        <div class="invitation-details">
                            <h2 class="card-heading">#{invitation.scope}</h2>
                            <p class="secondary-line">Created #{invitation.createdAtLabel} · Expires #{invitation.expiresAtLabel}</p>
                            <app:copy-field id="invitationLink"
                                            value="#{invitation.invitationLink}"
                                            inputAriaLabel="Invitation link for #{invitation.scope}, created #{invitation.createdAtLabel}"
                                            buttonAriaLabel="Copy invitation link for #{invitation.scope}, created #{invitation.createdAtLabel}"/>
                        </div>
                        <h:form styleClass="item-actions">
                            <input type="hidden" name="invitationId" value="#{invitation.id}"/>
                            <p:commandButton value="Revoke"
                                             action="#{invitationView.revokeInvitation}"
                                             ajax="false"
                                             styleClass="ui-button-danger ui-button-outlined"
                                             pt:aria-label="Revoke invitation for #{invitation.scope}, created #{invitation.createdAtLabel}">
                                <p:confirm header="Revoke invitation"
                                           message="Revoke #{invitation.scope}, created #{invitation.createdAtLabel}, permanently?"
                                           yesButtonLabel="Revoke invitation"
                                           yesButtonClass="ui-button-danger"
                                           noButtonLabel="Cancel"
                                           noButtonClass="ui-button-secondary ui-button-outlined"
                                           beforeShow="focusConfirmationCancelButton();"/>
                            </p:commandButton>
                        </h:form>
                    </article>
                </ui:repeat>
            </div>
            <app:confirmation-dialog id="invitationConfirmation"/>
        </section>
    </ui:define>
</ui:composition>
