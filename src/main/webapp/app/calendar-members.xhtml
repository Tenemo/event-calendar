<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:app="jakarta.faces.composite/app-components"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/main.xhtml">
    <f:metadata>
        <f:viewParam name="id" value="#{calendarMembersView.calendarIdParameter}"/>
        <f:viewAction action="#{calendarMembersView.load}" onPostback="false"/>
    </f:metadata>

    <ui:define name="title">Members - Shared calendar</ui:define>

    <ui:define name="content">
        <h:panelGroup id="membersPage" layout="block">
        <h:panelGroup id="membersContent" layout="block" styleClass="page-section" rendered="#{calendarMembersView.available}">
            <app:page-header id="calendarMembersHeader"
                             title="Members"
                             eyebrow="#{calendarMembersView.calendarName}"
                             description="Manage calendar-specific roles and access."
                             compact="true"
                             focusable="true"
                             focusIdentifier="membersHeading">
                <f:facet name="actions">
                    <h:panelGroup layout="block" styleClass="page-header-action-group">
                        <h:outputLink value="#{request.contextPath}/app/invitations"
                                      styleClass="button-link primary-link">Create editor invitation</h:outputLink>
                        <h:outputLink value="#{request.contextPath}/#{calendarMembersView.calendarLinkToken}"
                                      styleClass="button-link secondary-link">Back to calendar</h:outputLink>
                    </h:panelGroup>
                </f:facet>
            </app:page-header>

            <app:empty-state id="emptyMemberList"
                             title="No members are available"
                             description="Members with access to this calendar will appear here."
                             rendered="#{empty calendarMembersView.members}"/>
            <p:dataList id="memberList"
                        value="#{calendarMembersView.members}"
                        var="member"
                        type="unordered"
                        rowStatePreserved="true"
                        styleClass="member-card-list"
                        rendered="#{not empty calendarMembersView.members}">
                    <article class="list-card member-card">
                        <div>
                            <h2 class="card-heading">#{member.displayName}#{member.currentUser ? ' (you)' : ''}</h2>
                            <p class="secondary-line">@#{member.username}</p>
                        </div>
                        <h:form styleClass="member-actions">
                            <span class="member-role-label">#{member.role.displayName}</span>
                            <p:commandButton value="Make admin"
                                             action="#{calendarMembersView.makeAdmin(member.userId)}"
                                             ariaLabel="Make #{member.displayName} an admin"
                                             rendered="#{member.role eq 'EDITOR'}"
                                             ajax="true"
                                             process="@this"
                                             update=":messages :membersPage"
                                             oncomplete="focusAfterAjax(args, 'membersHeading');"
                                             styleClass="ui-button-outlined"/>
                            <p:commandButton value="Make editor"
                                             action="#{calendarMembersView.makeEditor(member.userId)}"
                                             ariaLabel="Make #{member.displayName} an editor"
                                             rendered="#{member.role eq 'ADMIN'}"
                                             ajax="true"
                                             process="@this"
                                             update=":messages :membersPage"
                                             oncomplete="focusAfterAjax(args, 'membersHeading');"
                                             styleClass="ui-button-outlined"/>
                            <p:commandButton value="Remove access"
                                             action="#{calendarMembersView.removeMemberAccess(member.userId)}"
                                             ariaLabel="Remove access for #{member.displayName}"
                                             ajax="true"
                                             process="@this"
                                             update=":messages :membersPage"
                                             oncomplete="focusAfterAjax(args, 'membersHeading');"
                                             styleClass="ui-button-danger ui-button-outlined">
                                <p:confirm header="Remove member access"
                                           message="Remove this member's access to the calendar?"
                                           yesButtonLabel="Remove access"
                                           yesButtonClass="ui-button-danger"
                                           noButtonLabel="Cancel"
                                           noButtonClass="ui-button-secondary ui-button-outlined"
                                           beforeShow="focusConfirmationCancelButton();"/>
                            </p:commandButton>
                        </h:form>
                    </article>
            </p:dataList>
            <app:confirmation-dialog id="memberConfirmation"/>
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="narrow-section not-found-state" rendered="#{not calendarMembersView.available}">
            <h1>Calendar not found</h1>
            <p>The calendar does not exist or you do not have admin access.</p>
        </h:panelGroup>
        </h:panelGroup>
    </ui:define>
</ui:composition>
