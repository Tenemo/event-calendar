[tools]
actionlint = "1.7.12"
java = "temurin-25.0.3+9.0.LTS"
maven = "3.9.11"
node = "24.18.0"

[env]
_.file = ".env"

[tasks.db]
description = "Start local PostgreSQL"
run = "docker compose up --detach --wait postgres"

[tasks.dev]
description = "Run Open Liberty dev mode"
run = "mvn -Pliberty-dev liberty:dev"

[tasks.package]
description = "Build, test, format-check, and analyze the WAR"
run = "mvn -B -ntp verify"

[tasks.format]
description = "Format Java and repository configuration"
run = "mvn -B -ntp spotless:apply"

[tasks.lint-css]
description = "Lint CSS"
run = [
    "npm ci --ignore-scripts",
    "npm run lint:css",
]

[tasks.lint-workflows]
description = "Lint GitHub Actions workflows"
run = "actionlint -shellcheck="

[tasks.end-to-end]
description = "Run Chromium tests against an isolated disposable database"
run = [
    "mvn -B -ntp -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args=\"install --with-deps chromium\" org.codehaus.mojo:exec-maven-plugin:3.5.0:java",
    "mvn -B -ntp -Pend-to-end verify",
]

[tasks.lighthouse]
description = "Run Lighthouse budgets against APP_BASE_URL"
run = [
    "npm ci --ignore-scripts",
    "npm run lighthouse",
]

[tasks.docker-build]
description = "Build the production image"
run = "docker build --tag shared-calendar:local ."

[tasks.docker-up]
description = "Build and start the application with local PostgreSQL"
run = "docker compose --profile application up --build --detach --wait"
